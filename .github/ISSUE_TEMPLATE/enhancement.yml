name: Enhancement
description: A new feature, performance work or cleanup.
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What should change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: The problem this solves, or how it helps the goals - full functionality, better performance, the same vibes.
  - type: textarea
    id: notes
    attributes:
      label: Implementation notes
      description: Files, systems or approaches you already know are involved.
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] ...
