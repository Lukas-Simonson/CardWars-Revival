name: Question or verification
description: Something that needs checking or deciding, such as testing on hardware or choosing an approach.
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: What needs to be answered or verified?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What is known so far
  - type: textarea
    id: done
    attributes:
      label: How will we know it is settled?
